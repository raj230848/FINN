services:
  - type: web
    name: finn
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    numInstances: 1
    healthCheckPath: /api/ready
    disk:
      name: finn-sqlite
      mountPath: /var/lib/finn
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        value: sqlite:////var/lib/finn/finn.db
      - key: FINN_API_TOKEN
        generateValue: true
      - key: FINN_ACCESS_TOKEN
        generateValue: true
      - key: FINN_SESSION_SECRET
        generateValue: true
      - key: FINN_PUBLIC_MODE
        value: "true"
      - key: FINN_GUEST_MODE
        value: "true"
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: https://github.com/raj230848/FINN
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: PUBLIC_DEPLOYMENT
        value: "true"
      - key: ENABLE_SCHEDULER
        value: "true"
