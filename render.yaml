services:
  - type: web
    name: finn-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /api/health
    disk:
      name: finn-sqlite
      mountPath: /var/lib/finn
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        value: sqlite:////var/lib/finn/finn.db
      - key: FINN_API_TOKEN
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: PUBLIC_DEPLOYMENT
        value: "true"
      - key: ENABLE_SCHEDULER
        value: "false"
