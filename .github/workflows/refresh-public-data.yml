name: Refresh public FINN data
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/refresh_public_snapshot.py
      - .github/workflows/refresh-public-data.yml
  schedule:
    # UTC. Checks at :07 and :37 avoid the congested start of each hour.
    # 09:37-19:07 IST weekdays; an extra 19:37 IST catch-up checks EOD data.
    - cron: '7,37 4-13 * * 1-5'
    - cron: '7 14 * * 1-5'
permissions:
  contents: write
concurrency:
  group: finn-public-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt
      - run: pip install -r backend/requirements.lock.txt
      - name: Refresh public sources and preserve failed-source history
        env:
          GEMINI_API_KEY: ''
          ENABLE_SCHEDULER: 'false'
          FORCE_MARKET: ${{ github.event_name != 'schedule' }}
        run: |
          args=()
          if [ "$FORCE_MARKET" = "true" ]; then args+=(--force-market); fi
          python scripts/refresh_public_snapshot.py "${args[@]}"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check source-only data and application calculations
        working-directory: public-site
        run: node --experimental-strip-types --test tests/demo.test.mjs
      - name: Publish the refreshed feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public-site/public/data/snapshot-sourced.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh sourced FINN market and filing data"
          git pull --rebase origin main
          git push origin HEAD:main
